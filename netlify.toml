# Netlify-Konfiguration – wird erst beim Veröffentlichen wirksam (noch nicht aktiv).
# Die Website ist rein statisch: kein Build-Schritt, Netlify liefert den Ordner "site" aus.
[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    # VORSCHAU-PHASE: Suchmaschinen sollen die Testversion nicht aufnehmen.
    # Vor dem Go-Live diese Zeile löschen (siehe docs/08-go-live-checkliste.md).
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.sanity.io; media-src 'self' https://cdn.sanity.io; font-src 'self'; connect-src 'self' https://o1wd66uu.apicdn.sanity.io https://o1wd66uu.api.sanity.io; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Skripte und Design: Dateinamen tragen eine Versionsnummer (?v=…, siehe tools/sync_partials.py),
# zusätzlich fragt der Browser bei jedem Laden kurz nach, ob es eine neue Fassung gibt.
# So passen nach einem Deploy nie alte und neue Dateien zusammen.
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
