backend:
  name: git-gateway
  branch: main

# Wo hochgeladene Bilder aus dem CMS landen (später nutzbar, z. B. für Team-Fotos)
# WICHTIG: bewusst OHNE führenden Schrägstrich, damit die Pfade relativ sind –
# das funktioniert unabhängig davon, ob die Seite an der Domain-Wurzel liegt
# (z. B. Netlify) oder unter einer Unteradresse (z. B. github.io/Reponame).
media_folder: "data/uploads"
public_folder: "data/uploads"

# Zeigt eine Vorschau des Live-Deploys nach dem Speichern an (Netlify erkennt das automatisch)
site_url: https://DEIN-NETLIFY-NAME.netlify.app

collections:
  - name: "termine"
    label: "Termine"
    files:
      - file: "data/termine.json"
        label: "Terminliste"
        name: "termine"
        fields:
          - label: "Alle Termine"
            name: "termine"
            widget: "list"
            summary: "{{title}} — {{date}}"
            fields:
              - label: "Kategorie"
                name: "cat"
                widget: "select"
                options:
                  - { label: "Akademie / Ausbildung", value: "akademie" }
                  - { label: "Offener Treff", value: "offen" }
              - label: "Datum / Uhrzeit (Anzeigetext)"
                name: "date"
                widget: "string"
                hint: "z. B. „28. Sep 2026 · 19–21 Uhr“"
              - label: "Titel"
                name: "title"
                widget: "string"
              - label: "Beschreibung"
                name: "desc"
                widget: "text"
              - label: "Ort / Kosten (Anzeigetext)"
                name: "meta"
                widget: "string"
                hint: "z. B. „Kulturzentrum LUISE, München · 1–5 €“"
              - label: "Bild"
                name: "img"
                widget: "image"
                required: false
                hint: "Optional: Eigenes Foto hochladen. Ohne Auswahl bleibt die Illustration der Website."
              - label: "Ausgebucht?"
                name: "full"
                widget: "boolean"
                default: false

  - name: "team"
    label: "Team (Über uns)"
    files:
      - file: "data/team.json"
        label: "Dozentinnen"
        name: "team"
        fields:
          - label: "Alle Dozentinnen"
            name: "team"
            widget: "list"
            summary: "{{name}} ({{ort}})"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "Ort"
                name: "ort"
                widget: "string"
              - label: "Schwerpunkt"
                name: "fach"
                widget: "string"
                hint: "z. B. „Stimme, Präsenz & Bühne“"
              - label: "Initialen (für Platzhalter ohne Foto)"
                name: "ini"
                widget: "string"
                hint: "z. B. „GA“ – wird angezeigt, solange kein Foto hochgeladen ist"
              - label: "Audio-Intro-Text"
                name: "intro"
                widget: "text"
                hint: "Kurzer Vorstellungssatz (wird als Demo-Audio vorgelesen)"
              - label: "Foto"
                name: "foto"
                widget: "image"
                required: false
                hint: "Porträtfoto hochladen – am besten quadratisch. Ohne Foto erscheinen die Initialen."

  - name: "seiten"
    label: "Seitenbilder"
    files:
      - file: "data/seiten.json"
        label: "Titelbilder & Impressionen"
        name: "seiten"
        fields:
          - label: "Titelbild Startseite"
            name: "home_hero"
            widget: "image"
            required: false
            hint: "Großes Bild hinter der Startseiten-Überschrift. Leer = grüner Farbverlauf."
          - label: "Titelbild „Über uns“"
            name: "ueberuns_hero"
            widget: "image"
            required: false
            hint: "Großes Bild im Kopf der Über-uns-Seite. Leer = grüner Farbverlauf."
          - label: "Impressionen (Galerie auf der Startseite)"
            name: "impressionen"
            widget: "list"
            summary: "{{unterschrift}}"
            fields:
              - label: "Bild"
                name: "bild"
                widget: "image"
                required: false
                hint: "Leer lassen = dekorativer Platzhalter"
              - label: "Bildunterschrift"
                name: "unterschrift"
                widget: "string"
